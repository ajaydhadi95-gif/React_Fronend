apiVersion: apps/v1
kind: Deployment

metadata:
  name: booking-frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: booking-frontend

  template:
    metadata:
      labels:
        app: booking-frontend

    spec:
      containers:
        - name: booking-frontend
          image: ajaydhadi95/booking_frontend:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service

metadata:
  name: booking-frontend-service

spec:
  type: LoadBalancer

  selector:
    app: booking-frontend

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80